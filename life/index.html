<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ina Klaric</title>
<meta name="description" content="A dollhouse with five rooms, a cellar of code, and thirty things to open. Ina Klaric — MSc Artificial Intelligence, University of Amsterdam.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ac:#5f8f6f;
  --card:#fcf7ea;
  --ink:#463527;
  --dim:#8c7962;
  --line:rgba(70,53,39,.16);
  --fd:'Young Serif',Georgia,'Times New Roman',serif;   /* cut, not typed */
  --fb:'Karla',ui-sans-serif,system-ui,sans-serif;      /* the reading voice */
  --fm:'Courier Prime','Courier New',ui-monospace,monospace;  /* the label on the drawer */
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--ink);font-family:var(--fb);
  overflow:hidden;-webkit-font-smoothing:antialiased;
  background:#aecbd8;
}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
body.zoom #scene{cursor:zoom-out}

#cam{transform-box:view-box;transform-origin:0 0;
  transition:transform .62s cubic-bezier(.38,0,.18,1)}
#back,#front,#yard,#yardfg{transition:opacity .45s ease}
body.zoom #back,body.zoom #front{opacity:.42}
body.zoom #yard,body.zoom #yardfg{opacity:.5}
.room{transition:opacity .45s ease,filter .25s ease;cursor:zoom-in}
body.zoom .room:not(.active){opacity:.16;cursor:zoom-out}
body.zoom .room.active{cursor:default}
body:not(.zoom) .room:hover{filter:brightness(1.06) saturate(1.05)}
.room:focus,.obj:focus{outline:none}
.room.active .obj:focus-visible .shape{filter:brightness(1.18) drop-shadow(0 0 3px var(--rc))}
body:not(.zoom) .room:focus-visible{filter:brightness(1.12)}

.obj{pointer-events:none}
.room.active .obj{pointer-events:auto;cursor:pointer}
.room.active .obj:hover .shape{filter:brightness(1.1)}
.mk{opacity:0;transition:opacity .4s ease .2s}
.room.active .mk{opacity:1}
.mk .core{fill:var(--rc)}
.mk .halo,.mk .ring{pointer-events:none}
.mk .ring{fill:none;stroke:var(--rc);stroke-width:1.7;animation:ping 2.8s ease-out infinite}
@keyframes ping{0%{r:5;opacity:.95}72%{r:15;opacity:0}100%{r:15;opacity:0}}

#bar{position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:flex-start;gap:14px;padding:16px clamp(14px,3vw,30px);pointer-events:none}
#bar>*{pointer-events:auto}
.nm{font-family:var(--fd);font-weight:400;font-size:21px;letter-spacing:0;line-height:1.1;
  color:#33281d;text-shadow:0 1px 2px rgba(255,255,255,.55)}
#ident{transition:opacity .3s}
body.zoom #ident{opacity:0;pointer-events:none}
.sp{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;
  border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink);
  cursor:pointer;box-shadow:0 2px 6px rgba(70,53,39,.08);transition:all .2s}
.btn:hover{background:#fff;border-color:var(--ac);transform:translateY(-1px)}

#cap{position:fixed;left:clamp(16px,3vw,34px);bottom:clamp(18px,3vw,30px);z-index:18;
  pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .35s,transform .35s}
body.zoom #cap{opacity:1;transform:none}
#cap i{display:flex;align-items:center;gap:7px;font-style:normal;font-family:var(--fm);
  font-size:11.5px;color:#6d5b48;margin-bottom:7px}
#cap i::before{content:"";width:8px;height:8px;background:var(--ac);border-radius:1px;flex:none}
#cap b{font-family:var(--fd);font-size:clamp(25px,3.7vw,41px);font-weight:400;letter-spacing:-.005em;line-height:1.02}
#cap s{display:block;text-decoration:none;font-size:11.5px;color:var(--dim);margin-top:8px}

#tip{position:fixed;z-index:19;pointer-events:none;opacity:0;transition:opacity .18s;
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;
  box-shadow:0 6px 16px rgba(70,53,39,.14);transform:translate(-50%,-140%)}
#tip.on{opacity:1}
#tip i{display:block;font-style:normal;font-family:var(--fm);font-size:10.5px;color:#7d6a56;margin-bottom:2px}
#tip b{font-family:var(--fd);font-size:14.5px;font-weight:400}

#card{position:fixed;z-index:25;right:clamp(14px,3vw,30px);top:50%;
  transform:translateY(-50%) translateX(14px);width:min(370px,calc(100vw - 32px));
  background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 18px 46px rgba(70,53,39,.2);opacity:0;pointer-events:none;
  transition:opacity .28s,transform .28s}
#card.on{opacity:1;pointer-events:auto;transform:translateY(-50%) translateX(0)}
#card .bar{height:4px;background:var(--ac)}
#card .in{padding:20px 22px 22px}
#card .kv{display:flex;align-items:baseline;gap:9px;padding:0 30px 7px 0;margin-bottom:12px;
  border-bottom:1px solid var(--line);font-family:var(--fm);font-size:11.5px;color:#6d5b48}
#card .kind{position:relative;padding-left:14px}
#card .kind::before{content:"";position:absolute;left:0;top:.44em;width:8px;height:8px;
  background:var(--ac);border-radius:1px}
#card .yr{margin-left:auto;color:#8c7962}
#card h2{font-family:var(--fd);margin:0;font-size:21.5px;line-height:1.2;letter-spacing:-.004em;font-weight:400}
#card .who{font-family:var(--fb);font-style:italic;font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.45}
#card p{margin:13px 0 0;font-size:14.5px;line-height:1.62;color:#53432f}
#card a.go{display:inline-block;margin-top:16px;font-family:var(--fm);font-size:11.5px;font-weight:700;
  color:#53432f;text-decoration:none;border-bottom:1.5px solid var(--ac);padding-bottom:2px}
#card a.go:hover{background:rgba(70,53,39,.05)}
#card .x{position:absolute;top:13px;right:13px;width:27px;height:27px;border-radius:50%;
  background:rgba(70,53,39,.08);border:0;color:var(--ink);cursor:pointer;font-size:15px;line-height:1}
#card .x:hover{background:rgba(70,53,39,.18)}
#card .row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
#card .row:last-child{border-bottom:0}
#card .k{font-family:var(--fm);font-size:11px;color:#8c7962;min-width:72px;padding-top:2px}
#card .row a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
#card .row a:hover{color:var(--ac);border-color:var(--ac)}

/* the cellar hatch: breathing light, only alive on the closed house */
#hatch{cursor:pointer}
body.zoom #hatch{pointer-events:none}
.hatchGlow{animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}
#hatch:hover{filter:brightness(1.14)}
#hatch:focus{outline:none}
#hatch:focus-visible .hatchGlow{opacity:1}
#hatch:focus-visible{filter:brightness(1.22)}
.room.cellar{display:none}
body.cellar-open .room.cellar{display:block}
body.cellar-open #hatch{opacity:.35}

/* ---- the dock: hop straight between rooms without backing out ---- */
#dock{position:fixed;left:50%;bottom:clamp(14px,3vw,26px);transform:translate(-50%,12px);
  z-index:22;display:flex;align-items:center;gap:13px;padding:10px 15px;border-radius:99px;
  background:var(--card);border:1px solid var(--line);box-shadow:0 6px 20px rgba(70,53,39,.18);
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
body.zoom #dock{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#dock button{width:11px;height:11px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:var(--dc);opacity:.4;transition:opacity .18s,transform .18s,box-shadow .18s}
#dock button:hover,#dock button:focus-visible{opacity:1;transform:scale(1.3);outline:none}
#dock button.now{opacity:1;transform:scale(1.3);box-shadow:0 0 0 3.5px rgba(70,53,39,.13)}
#dock .sep{width:1px;height:14px;background:var(--line);margin:0 1px}

/* ---- the opening guide: what is where, and what to press ---- */
#guide{position:fixed;z-index:26;left:clamp(14px,3vw,30px);top:50%;
  transform:translateY(-50%) translateX(-14px);width:min(330px,calc(100vw - 32px));
  background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 18px 46px rgba(70,53,39,.22);opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s}
#guide.on{opacity:1;pointer-events:auto;transform:translateY(-50%) translateX(0)}
#guide .in{padding:19px 20px 18px}
#guide .eyebrow{font-family:var(--fm);font-size:11.5px;color:#8c7962}
#guide h2{font-family:var(--fd);margin:6px 0 0;font-size:20.5px;font-weight:400;letter-spacing:-.004em;line-height:1.22}
#guide .lede{margin:8px 0 0;font-size:13px;line-height:1.5;color:#5c4a39}
#guide ul{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
#guide li{border-bottom:1px solid var(--line)}
#guide li button{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  background:none;border:0;padding:9px 2px;cursor:pointer;font-family:var(--fb);color:var(--ink);
  border-radius:7px;transition:background .15s}
#guide li button:hover{background:rgba(70,53,39,.06)}
#guide .d{width:9px;height:9px;border-radius:50%;background:var(--gc);flex:none;margin-top:4px}
#guide .t{font-size:14px;font-weight:600;line-height:1.3;letter-spacing:-.005em}
#guide .w{display:block;font-size:11.5px;font-weight:400;color:var(--dim);margin-top:2px;line-height:1.35}
#guide .how{margin:13px 0 0;font-size:12px;line-height:1.52;color:var(--dim)}
#guide .row2{display:flex;gap:8px;margin-top:14px;align-items:center}
#guide .row2 a{font-family:var(--fm);font-size:11.5px;font-weight:700;color:var(--ink);
  text-decoration:none;border-bottom:1.5px solid var(--line);padding-bottom:1px}
#guide .row2 a:hover{border-color:var(--ink)}
#guide .go{margin-left:auto;font-family:var(--fm);font-size:11.5px;font-weight:700;
  background:var(--ink);color:var(--card);border:0;border-radius:99px;padding:8px 15px;cursor:pointer}
#guide .go:hover{background:#2e2318}

@media(max-width:880px){
  #card{right:10px;left:10px;top:auto;bottom:10px;width:auto;transform:translateY(16px)}
  #card.on{transform:translateY(0)}
  #card{bottom:64px}
  #dock{bottom:16px}
  #guide{left:10px;right:10px;top:auto;bottom:10px;width:auto;transform:translateY(16px);
    max-height:min(78vh,620px);overflow:auto}
  #guide .in{padding:16px 17px 15px}
  #guide li button{padding:7px 2px}
  #guide .how{margin-top:11px}
  #guide .row2{margin-top:11px}
  #guide.on{transform:translateY(0)}
  #cap{bottom:auto;top:16px;left:clamp(14px,3vw,30px)}
  #cap b{font-size:22px}
  #tip{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<svg id="scene" viewBox="0 0 1240 900" preserveAspectRatio="xMidYMid meet" aria-label="A dollhouse with five rooms"></svg>

<div id="bar">
  <div id="ident"><div class="nm" id="pName">Ina Klaric</div></div>
  <span class="sp"></span>
  <button class="btn" id="gBtn" aria-label="What is where">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h3M4 12h3M4 18h3M11 6h9M11 12h9M11 18h9"/></svg>
  </button>
  <button class="btn" id="cBtn" aria-label="Contact">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>
  </button>
</div>

<div id="cap"><i id="capTag"></i><b id="capName"></b><s>Click the glowing points · click outside to step back</s></div>
<div id="tip"><i id="tipTag"></i><b id="tipName"></b></div>

<div id="dock" role="group" aria-label="Jump to a room"></div>

<div id="guide">
  <div class="in">
    <div class="eyebrow">Start here</div>
    <h2 id="guideH"></h2>
    <p class="lede" id="guideP"></p>
    <ul id="guideList"></ul>
    <p class="how">Click a room to go in, then the glowing points inside it. Click anywhere outside the room to come back out.</p>
    <div class="row2" id="guideLinks"></div>
  </div>
</div>

<div id="card">
  <div class="bar" id="cardBar"></div>
  <button class="x" id="cardX" aria-label="Close">×</button>
  <div class="in" id="cardIn"></div>
</div>

<script>
/* ===== dollhouse engine (inlined — this file is self-contained) ===== */
/* ============================================================
   dollhouse.js — a cottage dollhouse, open front, side elevation
   Flat 2D: x right, y down. Every room draws in its own local
   coordinate space with the floor line at (h - FLOOR).
   ============================================================ */

const n = v => Math.round(v*10)/10;
const A = op => op!=null ? ` opacity="${op}"` : "";

const R  = (x,y,w,h,f,rx,op)=>`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${f}"${rx?` rx="${n(rx)}"`:""}${A(op)}/>`;
const C  = (x,y,r,f,op)=>`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${f}"${A(op)}/>`;
const E  = (x,y,rx,ry,f,op)=>`<ellipse cx="${n(x)}" cy="${n(y)}" rx="${n(rx)}" ry="${n(ry)}" fill="${f}"${A(op)}/>`;
const PG = (p,f,op)=>`<polygon points="${p.map(q=>n(q[0])+","+n(q[1])).join(" ")}" fill="${f}"${A(op)}/>`;
const PH = (d,f,s,w,op,extra)=>`<path d="${d}" fill="${f||"none"}"${s?` stroke="${s}" stroke-width="${w||1}" stroke-linecap="round" stroke-linejoin="round"`:""}${A(op)}${extra||""}/>`;
const L  = (x1,y1,x2,y2,s,w,op)=>`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${s}" stroke-width="${w||1}" stroke-linecap="round"${A(op)}/>`;

function sh(hex,amt){
  const v=parseInt(hex.slice(1),16), r=(v>>16)&255, g=(v>>8)&255, b=v&255;
  const f=c=>Math.max(0,Math.min(255,Math.round(amt>0?c+(255-c)*amt:c*(1+amt))));
  return "#"+[f(r),f(g),f(b)].map(c=>c.toString(16).padStart(2,"0")).join("");
}
const hi=(x,y,w,h,o)=>R(x,y,w,h,"#ffffff",0,o==null?.18:o);
const lo=(x,y,w,h,o)=>R(x,y,w,h,"#000000",0,o==null?.14:o);

/* a shaded solid: light along the top, shadow along the bottom */
function blk(x,y,w,h,hex,rx){
  const t=Math.max(1.2,Math.min(3.5,h*.14)), b=Math.max(1.4,Math.min(4.5,h*.18));
  return R(x,y,w,h,hex,rx)+hi(x,y,w,t,.16)+lo(x,y+h-b,w,b,.13);
}
/* contact shadow where a thing meets the floor */
const cast=(x,y,rx,ry,o)=>`<ellipse cx="${n(x)}" cy="${n(y)}" rx="${n(rx)}" ry="${n(ry||3.2)}" fill="#3a2418" opacity="${o||.2}" filter="url(#soft)"/>`;

/* ============================================================
   WALL TREATMENTS
   ============================================================ */
/* small repeating botanical wallpaper */
function paperDef(id,base,ink,kind){
  let motif="";
  if(kind==="sprig"){
    motif = PH("M11,26 C11,18 14,13 19,9","",ink,1.3,.55)
      + PH("M19,9 C15,10 12,13 12,17 C16,17 19,14 19,9Z",ink,"",0,.5)
      + PH("M12,19 C9,17 6,17 4,19 C7,22 10,22 12,19Z",ink,"",0,.42)
      + [[30,32],[38,40]].map(p=>
          [0,72,144,216,288].map(a=>{
            const rad=a*Math.PI/180;
            return E(p[0]+Math.cos(rad)*3.4,p[1]+Math.sin(rad)*3.4,2.5,1.9,ink,.4);
          }).join("")+C(p[0],p[1],1.5,ink,.62)).join("");
  } else if(kind==="stripe"){
    motif = R(0,0,5,48,ink,0,.16)+R(22,0,2.2,48,ink,0,.1)
      + [[12,11],[35,33]].map(p=>C(p[0],p[1],1.7,ink,.3)+C(p[0]+4,p[1]+5,1.1,ink,.22)).join("");
  } else if(kind==="check"){
    motif = R(0,0,24,48,ink,0,.12)+R(0,0,48,24,ink,0,.12)+R(0,0,24,24,ink,0,.1);
  } else if(kind==="steel"){
    motif = R(1,1,46,46,ink,1.5,.12)
      + R(0,0,48,1.6,ink,0,.42) + R(0,0,1.6,48,ink,0,.34)
      + R(2,2,44,1.4,"#ffffff",0,.07)
      + [[6,6],[42,6],[6,42],[42,42]].map(q=>C(q[0],q[1],1.7,ink,.55)
          + C(q[0]-.5,q[1]-.5,.8,"#ffffff",.16)).join("");
  } else if(kind==="brick"){
    const row=(y,off)=>[-1,0,1,2].map(i=>R(off+i*25,y,23,11,ink,1,.17)).join("");
    motif = row(1,0)+row(13,-12)+row(25,0)+row(37,-12);
  } else { /* dot + leaf */
    motif = [[10,12],[34,36]].map(p=>
        PH(`M${p[0]},${p[1]} C${p[0]-6},${p[1]-3} ${p[0]-6},${p[1]-10} ${p[0]},${p[1]-12} C${p[0]+6},${p[1]-10} ${p[0]+6},${p[1]-3} ${p[0]},${p[1]}Z`,ink,"",0,.36)
        + L(p[0],p[1],p[0],p[1]-11,ink,.9,.4)).join("")
      + C(30,10,1.8,ink,.3)+C(12,38,1.8,ink,.3);
  }
  return `<pattern id="${id}" width="48" height="48" patternUnits="userSpaceOnUse">`
    + R(0,0,48,48,base) + motif + `</pattern>`;
}
/* beadboard wainscot with a capping rail */
function wainscot(w,y,h,col){
  let s=R(0,y,w,h,col)+hi(0,y,w,2,.3);
  for(let x=7;x<w;x+=11) s+=L(x,y+5,x,y+h,sh(col,-.2),1,.5);
  s+=R(0,y,w,5,sh(col,.12))+R(0,y+3,w,2.2,sh(col,-.16))+lo(0,y+h-3,w,3,.1);
  return s;
}
/* floorboards seen almost edge-on */
function floorBoards(w,h,wood,seed){
  const fy=h-FLOOR;
  let s=R(0,fy,w,FLOOR,wood)+hi(0,fy,w,2.4,.22);
  for(let x=((seed*13)%17)+9;x<w;x+=Math.max(26,w/9)) s+=L(x,fy+2.5,x-2,h,sh(wood,-.26),1.1,.55);
  s+=R(0,fy,w,1.6,sh(wood,-.3))+lo(0,h-4,w,4,.16);
  return s;
}
const beam=(w,col)=>blk(0,0,w,11,col)+lo(0,10,w,3,.18);

/* ============================================================
   FURNITURE — flat, front-facing, all sitting on a floor line
   ============================================================ */
function legs(x,w,fy,top,wood,thick){
  const t=thick||5;
  return blk(x+2,top,t,fy-top,sh(wood,-.12),1)+blk(x+w-t-2,top,t,fy-top,sh(wood,-.2),1);
}
function table(x,fy,w,h,wood){
  const top=fy-h;
  return cast(x+w/2,fy+1,w*.54,3.4)
    + legs(x,w,fy,top+7,wood)
    + blk(x-3,top,w+6,8,wood,1.5)
    + R(x+4,top+8,w-8,3.5,sh(wood,-.22));
}
function desk(x,fy,w,h,wood,dr){
  const top=fy-h;
  let s=cast(x+w/2,fy+1,w*.56,3.6)
    + blk(x+3,top+9,7,h-9,sh(wood,-.16),1) + blk(x+w-10,top+9,7,h-9,sh(wood,-.22),1)
    + blk(x-3,top,w+6,9,wood,1.5);
  if(dr!==false){
    s+=blk(x+w*.42,top+11,w*.5,h*.46,sh(wood,-.05),1.5);
    for(let i=0;i<2;i++){
      const dy=top+14+i*(h*.46-8)/1.6;
      s+=R(x+w*.45,dy,w*.44,1.4,sh(wood,-.3),0,.5)
        + R(x+w*.62,dy+ (h*.46)/5,w*.1,2.6,sh(wood,.3),1.2);
    }
  }
  return s;
}
function chair(x,fy,s,wood,back){
  const w=22*s,seat=fy-22*s,bh=(back||30)*s;
  let o=cast(x+w/2,fy+1,w*.6,3)
    + blk(x+2,seat+3,4*s,fy-seat-3,sh(wood,-.18),1)
    + blk(x+w-6*s,seat+3,4*s,fy-seat-3,sh(wood,-.26),1)
    + blk(x,seat,w,5*s,wood,1.2);

/* ============================================================
   RENDER ONE ROOM
   ============================================================ */
function roomInner(r){
  const w=r.w, h=r.h;
  let s = R(0,0,w,h,`url(#pap-${r.id})`);
  s += `<g pointer-events="none">` + R(0,0,w,h,`url(#roomLight)`) + `</g>`;
  let items=[];
  r.decor(w,h,r.accent).forEach(d=>items.push({z:d[0],h:d[1]}));
  r.objects.forEach((o,i)=>{
    const m=o.mk;
    items.push({z:o.z, h:
      `<g class="obj" data-i="${i}" tabindex="-1" role="button" aria-label="${o.label}">`
      + `<g class="shape">${o.draw.call(r,w,h,r.accent)}</g>`
      + `<g class="mk" transform="translate(${n(m[0])},${n(m[1])})">`
      + `<circle class="hit" r="16" fill="transparent"/>`
      + `<circle class="ring" r="5"/>`
      + `<circle class="halo" r="6.6" fill="#fffaf0" opacity=".55"/>`
      + `<circle class="core" r="3.4"/></g></g>`});
  });
  items.sort((a,b)=>a.z-b.z);
  s += items.map(i=>i.h).join("");
  // overlays must never intercept clicks, or nothing inside the room is clickable
  s += `<g pointer-events="none">`
     + R(0,0,w,h,`url(#vig)`)
     + R(0,0,w,4,"#2a1a10",0,.22) + R(0,0,4,h,"#2a1a10",0,.14)
     + R(w-3,0,3,h,"#2a1a10",0,.1)
     + `</g>`;
  return s;
}

function roomDefs(){
  return ROOMS.map(r=>
    paperDef(`pap-${r.id}`, r.paper[0], r.paper[1], r.paper[2])
    + `<linearGradient id="view-${r.id}" x1="0" y1="0" x2="0" y2="1">`
    + `<stop offset="0%" stop-color="${r.view[0]}"/><stop offset="100%" stop-color="${r.view[1]}"/></linearGradient>`
    + (r.clip ? `<clipPath id="clip-${r.id}"><polygon points="${r.clip.map(p=>p.join(",")).join(" ")}"/></clipPath>`
              : `<clipPath id="clip-${r.id}"><rect width="${r.w}" height="${r.h}"/></clipPath>`)
  ).join("");
}

  s+=R(312,514,616,12,PLASTER2)+hi(312,514,616,2.6,.4)+lo(312,523,616,3,.12);

  // dividers between the paired rooms
  s+=R(614,341,12,175,PLASTER2)+hi(614,341,12,2.4,.35);
  s+=R(614,528,12,175,PLASTER2)+hi(614,528,12,2.4,.35);
  // climbing roses on the outer corners
  const vine=(bx,by,tx,ty,flip)=>{
    let v=PH(`M${bx},${by} C${bx+flip*28},${by-66} ${tx-flip*25},${ty+80} ${tx},${ty}`,"","#5f7a52",3,.95);
    for(let i=0;i<12;i++){
      const t=i/11, px=bx+(tx-bx)*t+Math.sin(t*7)*8*flip, py=by+(ty-by)*t;
      v+=E(px,py,5.8,4.5,i%2?"#6b8a5c":"#5f7a52",.95);

      if(i%4===2) v+=C(px-6*flip,py+3,3.2,"#e8a3b0",.9);
    }
    return v;
  };
  s+=vine(300,712,320,341,1);
  s+=vine(940,712,922,341,-1);
  // window boxes
  const boxAt=(x,y,w)=>{
    let b=blk(x,y,w,13,"#9c7a56",2)+R(x+2.5,y+2.5,w-5,2.5,sh("#9c7a56",-.24),0,.6);
    for(let i=0;i<Math.floor(w/11);i++){
      const px=x+6+i*11;
      b+=E(px,y-2,5.6,4.6,i%2?"#6f8f5c":"#5f7a52")+C(px-1.8,y-5.4,3.1,["#d98fa0","#e8c26a","#d9a0c4","#e89a7a"][i%4])
        +C(px+2.6,y-3.2,2.5,["#e8c26a","#d98fa0","#e89a7a","#d9a0c4"][i%4],.95);
    }
    return b;
  };
  s+=boxAt(617,516,44)+boxAt(372,703,46)+boxAt(840,703,46);
  // gable bargeboard
  s+=PH(`M${EAVE_L[0]-22},${EAVE_L[1]+2} L${APEX[0]},${APEX[1]-6} L${EAVE_R[0]+22},${EAVE_R[1]+2}`,"",TRIM,7,1);
  s+=PH(`M${EAVE_L[0]-12},${EAVE_L[1]+2} L${APEX[0]},${APEX[1]+5} L${EAVE_R[0]+12},${EAVE_R[1]+2}`,"",sh(TRIM,-.14),2,.6);
  return s;
}

/* the cellar hatch in the ground floor, with light spilling up out of it */

    + E(620,y+5,38,14,"#fff6dd",.5) + `</g>`;

    + R(x1+3,y+1,x2-x1-6,13,"url(#hatchLight)")
    + R(x1,y,x2-x1,3.5,"#2a1c12",0,.55);

  s+=[4.5,9,13].map((d,i)=>L(x1+13,y+d,x2-13,y+d,"#8a6e50",2.4,.8-i*.2)).join("");
  // the door leaf, propped open on its hinge
  s+=PG([[x2-2,y+2],[x2+34,y-28],[x2+41,y-23],[x2+5,y+7]],"#9c7a56")
    + PG([[x2-2,y+2],[x2+34,y-28],[x2+35,y-24],[x2-1,y+6]],sh("#9c7a56",-.32))
    + PG([[x2+8,y-5],[x2+30,y-23],[x2+32,y-21],[x2+10,y-3]],sh("#9c7a56",.18))
    + C(x2+2,y+3,3.2,"#6b5340");

  s+=`<rect x="${x1-34}" y="${y-34}" width="${x2-x1+76}" height="62" fill="transparent"/>`;

}

/* ============================================================
   THE BACK GARDEN — painted behind and in front of the house
   ============================================================ */
const HORIZON=646, YL=-1100, YW=3440;

function yardBack(){
  let s=R(YL,-900,YW,HORIZON+900,"url(#skyG)");
  s+=C(948,116,230,"url(#sunG)");
  // clouds
  [[150,156,88],[486,104,62],[1012,176,76],[1352,120,54],[-130,190,66]].forEach(c=>{
    s+=E(c[0],c[1],c[2],c[2]*.36,"#fdfaf2",.7)
      +E(c[0]-c[2]*.46,c[1]+c[2]*.13,c[2]*.5,c[2]*.27,"#fdfaf2",.58)
      +E(c[0]+c[2]*.5,c[1]+c[2]*.11,c[2]*.44,c[2]*.25,"#fdfaf2",.52);
  });
  // far treeline, then a nearer hedge
  for(let x=YL;x<YL+YW;x+=78){
    const hh=44+((Math.abs(x)*7)%38);
    s+=E(x,HORIZON-hh*.42,52,hh*.6,"#93ab83",.8);
  }
  for(let x=YL;x<YL+YW;x+=58) s+=E(x,HORIZON-14,44,28,"#72906a",.95);
  s+=R(YL,HORIZON-8,YW,14,"#72906a",0,.95);
  // picket fence
  s+=R(YL,HORIZON-2,YW,7,"#e8e0cd");
  for(let x=YL;x<YL+YW;x+=26)
    s+=PG([[x,HORIZON+4],[x+13,HORIZON+4],[x+13,HORIZON-30],[x+6.5,HORIZON-38],[x,HORIZON-30]],"#f2ebda")
      + PG([[x+10,HORIZON+4],[x+13,HORIZON+4],[x+13,HORIZON-30],[x+10,HORIZON-33]],"#d9d0ba");
  s+=R(YL,HORIZON-26,YW,5,"#e0d7c1")+R(YL,HORIZON-8,YW,5,"#e0d7c1");
  // lawn
  s+=R(YL,HORIZON,YW,1600,"url(#lawnG)");
  for(let i=1;i<11;i++) s+=R(YL,HORIZON+i*i*2.6,YW,i*2.2+5,"#ffffff",0,.045);
  // a tree on each side, standing behind the house
  const tree=(x,gy,sc)=>{
    let t=E(x,gy+4,46*sc,13*sc,"#5f7f4e",.3)
      + PH(`M${x-9*sc},${gy} q3,${-70*sc} ${-2*sc},${-96*sc} q14,10 ${22*sc},${-2*sc} q-8,${26*sc} ${-4*sc},${98*sc} Z`,"#8a6a4a");
    [[0,-128,56],[-38,-104,42],[38,-108,44],[-16,-158,40],[22,-152,36],[0,-96,46]]
      .forEach((b,i)=>{ t+=E(x+b[0]*sc,gy+b[1]*sc,b[2]*sc,b[2]*sc*.86,
          i%2?"#6f9460":"#7fa36b",.97); });
    t+=E(x-18*sc,gy-150*sc,22*sc,16*sc,"#93b87c",.5);
    return t;
  };
  s+=tree(162,HORIZON+36,1.08)+tree(1072,HORIZON+28,.92);
  // bushes along the fence line
  [[-40,8,.9],[300,14,.7],[760,10,.8],[1260,16,.75],[1480,8,.9]].forEach(b=>{
    const x=b[0], gy=HORIZON+b[1], sc=b[2];
    s+=E(x,gy,38*sc,26*sc,"#6f9460")+E(x-24*sc,gy+4,26*sc,19*sc,"#7fa36b")
      +E(x+24*sc,gy+3,24*sc,18*sc,"#7fa36b")
      +[[-10,-12],[12,-9],[0,-18]].map(f=>C(x+f[0]*sc,gy+f[1]*sc,4*sc,"#e8c26a",.9)).join("");
  });
  return s;
}

function yardFront(){
  // the ground the house stands on
  let s=E(620,748,398,30,"#3f5a33",.2)
    + E(620,744,348,21,"#3f5a33",.14);
  // soil borders hugging the foundations, lightly planted
  const bed=(x1,x2)=>{
    const w=x2-x1;
    let b=PH(`M${x1},743 q${w/2},-13 ${w},0 q${-w/2},23 ${-w},0Z`,"#6b543d")
        + PH(`M${x1+6},744 q${w/2},-9 ${w-12},0 q${-(w-12)/2},13 ${-(w-12)},0Z`,"#5c4733",0,0,.6);
    for(let x=x1+14;x<x2-8;x+=29){
      const t=(x-x1)/w, yy=742+Math.sin(t*7)*3;
      b+=E(x,yy+3,10,7,"#6f9460")+E(x+8,yy+5,8,6,"#7fa36b")
        +C(x+3,yy-5,3.4,["#d9a6b0","#e2c489","#c9a7cc","#e0a98f"][Math.floor(t*11)%4],.95)
        +C(x+9,yy-2,2.6,["#e2c489","#d9a6b0","#e0a98f","#c9a7cc"][Math.floor(t*7)%4],.9);
    }
    return b;
  };
  s+=bed(300,566)+bed(676,944);
  // a terracotta pot and a watering can tucked against the corners
  s+=E(272,768,28,9,"#3f5a33",.2)
    + PG([[254,744],[292,744],[287,768],[259,768]],"#c07f57")
    + R(252,740,42,7,"#cd8c63",2) + E(273,744,17,5,"#8a5f44",.45)
    + E(273,734,17,12,"#6f9460")+E(263,737,12,9,"#7fa36b")+E(283,736,11,8,"#7fa36b")
    + C(268,726,3.4,"#d9a6b0",.95)+C(280,728,2.8,"#e2c489",.9);
  s+=E(968,770,27,9,"#3f5a33",.2)
    + blk(950,744,34,26,"#9db3a8",2.5) + blk(947,739,40,7,"#aec2b8",2.5)
    + PH("M984,750 q18,2 20,18 l-6,0 q-2,-11 -14,-12Z","#9db3a8")
    + PH("M956,739 q9,-12 20,0","","#8aa096",4);
  // grass tufts across the near lawn
  for(let x=120;x<1140;x+=34){
    const gy=772+Math.sin(x*.055)*13;
    s+=PH(`M${x},${gy} q3,-12 7,-15 q-1,10 1,15Z`,"#6f9460",0,.7)
      +PH(`M${x+9},${gy+3} q4,-10 9,-12 q-3,8 -2,12Z`,"#7fa36b",0,.65);
  }
  return s;
}

<script>
/* ---- your details ---- */
const PROFILE={

};

/* what the opening guide says — ordered for someone with 30 seconds */
const GUIDE={
  headline:"Five rooms and a bunker.",

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// the view hugs the house itself, with only a little garden around it
const BOX={x:246, y:106, w:748, h:700}, PAD=30;
let VBX=BOX.x, VBY=BOX.y, VBW=BOX.w, VBH=BOX.h;

$("#pName").textContent=PROFILE.name;

const DEFS=`<defs>
${roomDefs()}
<filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.4"/></filter>
<radialGradient id="glow"><stop offset="0%" stop-color="#ffe6b0" stop-opacity=".75"/><stop offset="55%" stop-color="#ffd995" stop-opacity=".22"/><stop offset="100%" stop-color="#ffd07a" stop-opacity="0"/></radialGradient>
<linearGradient id="daylight" x1="0" y1="0" x2=".4" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity=".42"/><stop offset="60%" stop-color="#ffffff" stop-opacity=".06"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<linearGradient id="roomLight" x1=".7" y1="0" x2=".1" y2="1"><stop offset="0%" stop-color="#fff2d4" stop-opacity=".2"/><stop offset="100%" stop-color="#4a3020" stop-opacity=".16"/></linearGradient>
<radialGradient id="vig" cx=".5" cy=".38" r=".78"><stop offset="55%" stop-color="#2a1a10" stop-opacity="0"/><stop offset="100%" stop-color="#2a1a10" stop-opacity=".34"/></radialGradient>
<radialGradient id="globeShade" cx=".32" cy=".26"><stop offset="0%" stop-color="#fff" stop-opacity=".4"/><stop offset="65%" stop-color="#fff" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".3"/></radialGradient>
<radialGradient id="alert"><stop offset="0%" stop-color="#ff6a58" stop-opacity=".7"/><stop offset="100%" stop-color="#ff6a58" stop-opacity="0"/></radialGradient>
<radialGradient id="alert2"><stop offset="0%" stop-color="#5fd99a" stop-opacity=".8"/><stop offset="100%" stop-color="#5fd99a" stop-opacity="0"/></radialGradient>
<radialGradient id="alert3"><stop offset="0%" stop-color="#46c7d8" stop-opacity=".6"/><stop offset="100%" stop-color="#46c7d8" stop-opacity="0"/></radialGradient>
<linearGradient id="skyG" x1="0" y1="0" x2=".12" y2="1">
  <stop offset="0%" stop-color="#aecbd8"/><stop offset="42%" stop-color="#cfdfd9"/>

<linearGradient id="lawnG" x1="0" y1="0" x2=".08" y2="1">
  <stop offset="0%" stop-color="#93b074"/><stop offset="38%" stop-color="#83a364"/>
  <stop offset="100%" stop-color="#6f8f52"/></linearGradient>
<radialGradient id="sunG"><stop offset="0%" stop-color="#fff6d8" stop-opacity=".75"/>
  <stop offset="100%" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>

$("#scene").innerHTML = DEFS
  + `<g id="cam">`
  + `<g id="yard" pointer-events="none">${yardBack()}</g>`
  + `<g id="back">${houseBack()}</g>`
  + ROOMS.map(r=>
      `<g class="room${r.hidden?" cellar":""}" data-id="${r.id}" style="--rc:${r.accent}" tabindex="${r.hidden?-1:0}" role="button" aria-label="${esc(r.name)} — ${esc(r.tag)}">`
      + `<g transform="translate(${r.x},${r.y}) scale(${K})">`
      + `<g clip-path="url(#clip-${r.id})">`
      + `<rect width="${r.w}" height="${r.h}" fill="${r.paper[0]}"/>`
      + roomInner(r) + `</g></g></g>`).join("")
  + `<g id="front">${houseFront()}</g>`
  + `<g id="hatch" role="button" tabindex="0" aria-label="Open the cellar — projects on GitHub">${hatch()}</g>`
  + `<g id="yardfg" pointer-events="none">${yardFront()}</g>`
  + `</g>`;

/* ---- camera ---- */
const cam=$("#cam");
const VISIBLE=ROOMS.filter(r=>!r.hidden);
let open=null;

function fitViewBox(){
  const ar=Math.max(.35,innerWidth/Math.max(1,innerHeight));
  if(ar>=BOX.w/BOX.h){ VBH=BOX.h; VBW=BOX.h*ar; } else { VBW=BOX.w; VBH=BOX.w/ar; }
  VBX=BOX.x+BOX.w/2-VBW/2; VBY=BOX.y+BOX.h/2-VBH/2;
  $("#scene").setAttribute("viewBox",`${VBX} ${VBY} ${VBW} ${VBH}`);
  if(open) zoomTo(open,true);
}
function zoomTo(r,instant){
  const rw=r.w*K, rh=r.h*K;                       // the room as actually drawn
  const s=Math.min(VBW/(rw+PAD*2), VBH/(rh+PAD*2));
  if(instant) cam.style.transition="none";
  cam.style.transform=`translate(${VBX+VBW/2-s*(r.x+rw/2)}px,${VBY+VBH/2-s*(r.y+rh/2)}px) scale(${s})`;
  if(instant){ cam.getBoundingClientRect(); cam.style.transition=""; }
}
function enter(el){
  const r=ROOMS.find(x=>x.id===el.dataset.id);
  open=r;
  document.documentElement.style.setProperty("--ac",r.accent);
  $("#cardBar").style.background=r.accent;
  $("#capTag").textContent=r.tag;
  $("#capName").textContent=r.name;
  document.querySelectorAll(".room").forEach(g=>g.classList.toggle("active",g===el));
  document.querySelectorAll("#dock button").forEach(d=>d.classList.toggle("now",d.dataset.go===r.id));
  document.body.classList.add("zoom");
  hideTip();
  zoomTo(r);
  writeHash(r.id);
}
function leave(){
  if(!open) return;
  open=null; closeCard();
  document.body.classList.remove("zoom");
  document.querySelectorAll(".room").forEach(g=>g.classList.remove("active"));
  document.querySelectorAll("#dock button").forEach(d=>d.classList.remove("now"));
  cam.style.transform="";
  writeHash(null);
  // let the camera finish travelling before the cellar disappears again
  setTimeout(()=>{ if(!open) document.body.classList.remove("cellar-open"); },640);
}
function openCellar(){
  document.body.classList.add("cellar-open");
  requestAnimationFrame(()=>enter(document.querySelector('.room[data-id="cellar"]')));
}

/* ---- interaction ----
   Closed house: click a room to enter.
   Inside a room: click an object to read it; click anywhere
   that is not this room to step back out.                      */
$("#scene").addEventListener("click",e=>{
  hideGuide();
  if(!open && e.target.closest("#hatch")){ openCellar(); return; }
  const el=e.target.closest(".room");
  if(!open){ if(el) enter(el); return; }
  if(!el || el.dataset.id!==open.id){ leave(); return; }
  const g=e.target.closest(".obj");
  if(!g){ closeCard(); return; }
  const x=open.objects[+g.dataset.i].e;
  showCard(`<div class="kv"><span class="kind">${esc(x.kind)}</span>${x.yr?`<span class="yr">${esc(x.yr)}</span>`:""}</div>
    <h2>${esc(x.h)}</h2>${x.who?`<div class="who">${esc(x.who)}</div>`:""}
    <p>${esc(x.p)}</p>
    ${x.href?`<a class="go" href="${esc(x.href)}" target="_blank" rel="noopener">${esc(x.link)} →</a>`:""}`);
});
$("#scene").addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" ") return;
  if(open) return;
  if(e.target.closest("#hatch")){ e.preventDefault(); openCellar(); return; }
  const el=e.target.closest(".room"); if(!el) return;
  e.preventDefault(); enter(el);
});

/* ---- hover tooltip over the closed house ---- */
const tip=$("#tip");
function hideTip(){ tip.classList.remove("on"); }
$("#scene").addEventListener("mousemove",e=>{
  if(open) return hideTip();
  const hz=e.target.closest("#hatch");
  const el=hz?null:e.target.closest(".room");
  if(!hz && !el) return hideTip();
  const r=hz?ROOMS.find(x=>x.id==="cellar"):ROOMS.find(x=>x.id===el.dataset.id);
  $("#tipTag").textContent=hz?"Classified":r.tag;
  $("#tipName").textContent=r.name;
  tip.style.setProperty("--tc",r.accent);
  tip.style.left=e.clientX+"px"; tip.style.top=e.clientY+"px";
  tip.classList.add("on");
});
$("#scene").addEventListener("mouseleave",hideTip);

function showCard(h){ $("#cardIn").innerHTML=h; $("#card").classList.add("on"); }
function closeCard(){ $("#card").classList.remove("on"); }
$("#cardX").addEventListener("click",e=>{ e.stopPropagation(); closeCard(); });
$("#cBtn").addEventListener("click",()=>{
  $("#cardBar").style.background="var(--ac)";

    + PROFILE.contact.map(c=>`<div class="row"><span class="k">${esc(c[0])}</span>${
        c[2]?`<a href="${esc(c[2])}"${c[2].startsWith("http")?' target="_blank" rel="noopener"':''}>${esc(c[1])}</a>`
            :`<span style="color:var(--dim)">${esc(c[1])}</span>`}</div>`).join(""));
});

/* ---- the dock: every room, one hop away, while you are inside one ---- */
$("#dock").innerHTML = GUIDE.rooms.map(([id],i)=>{
  const r=ROOMS.find(x=>x.id===id);
  return (r.hidden?`<span class="sep"></span>`:"")
    + `<button data-go="${id}" style="--dc:${r.accent}" title="${esc(r.name)}" aria-label="${esc(r.name)}"></button>`;
}).join("");
$("#dock").addEventListener("click",e=>{
  const b=e.target.closest("button[data-go]"); if(!b) return;
  const id=b.dataset.go;
  if(open && open.id===id) return;
  closeCard();
  if(id==="cellar") openCellar(); else enter(document.querySelector(`.room[data-id="${id}"]`));
});

/* ---- deep links: /#study opens straight into that room ---- */
let hashBusy=false;
// Sandboxed previews (about:srcdoc, some embeds) forbid history writes and
// throw SecurityError. Probe once with a no-op replace; if it fails, the house
// still works, it just stops touching the address bar.
const CAN_ROUTE=(()=>{ try{
    // about:srcdoc and blob: previews have no shareable URL and reject history
    // writes outright, so don't touch the address bar there at all.
    if(!/^(https?|file):$/.test(location.protocol)) return false;
    history.replaceState(history.state,"",location.href);
    return true;
  }catch(e){ return false; } })();
function writeHash(id){
  if(!CAN_ROUTE) return;
  hashBusy=true;
  try{
    if(id){ if(location.hash!=="#"+id) location.hash=id; }
    else if(location.hash){
      try{ history.replaceState(null,"",location.pathname+location.search); }
      catch(e){ location.hash=""; }
    }
  }catch(e){}
  setTimeout(()=>{hashBusy=false;},0);
}
function readHash(){
  let id="";
  try{ id=decodeURIComponent(location.hash.replace(/^#/,"")); }catch(e){ return false; }
  const r=ROOMS.find(x=>x.id===id);
  if(!r){ if(open) leave(); return false; }
  if(open && open.id===id) return true;
  closeCard();
  if(r.hidden) openCellar(); else enter(document.querySelector(`.room[data-id="${id}"]`));
  return true;
}
addEventListener("hashchange",()=>{ if(!hashBusy) readHash(); });

/* ---- the opening guide ---- */
const guide=$("#guide");
$("#guideH").textContent=GUIDE.headline;
$("#guideP").textContent=GUIDE.lede;
$("#guideList").innerHTML=GUIDE.rooms.map(([id,what])=>{
  const r=ROOMS.find(x=>x.id===id);
  return `<li><button data-go="${id}" style="--gc:${r.accent}">
    <span class="d"></span>
    <span class="t">${esc(r.name)}<span class="w">${esc(what)}</span></span></button></li>`;
}).join("");
$("#guideLinks").innerHTML=
  `<a href="${esc(PROFILE.contact[2][2])}" target="_blank" rel="noopener">GitHub</a>`
+ `<a href="${esc(PROFILE.contact[0][2])}">Email</a>`
+ `<button class="go" id="guideGo">Look around</button>`;

function showGuide(){ guide.classList.add("on"); }
function hideGuide(){ guide.classList.remove("on"); }
$("#guideList").addEventListener("click",e=>{
  const b=e.target.closest("button[data-go]"); if(!b) return;
  hideGuide(); closeCard();
  if(b.dataset.go==="cellar"){ openCellar(); return; }
  enter(document.querySelector(`.room[data-id="${b.dataset.go}"]`));
});
$("#guideGo").addEventListener("click",hideGuide);
$("#gBtn").addEventListener("click",()=>{ closeCard(); guide.classList.toggle("on"); });
// a deep link goes straight to its room; otherwise the guide introduces the house
if(!readHash()) setTimeout(showGuide,650);

fitViewBox();
addEventListener("resize",fitViewBox);

addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(guide.classList.contains("on")) return hideGuide();
    $("#card").classList.contains("on") ? closeCard() : leave(); return; }
  if(!open||!["ArrowLeft","ArrowRight"].includes(e.key)) return;
  const i=VISIBLE.findIndex(r=>r.id===open.id);
  if(i<0){ closeCard(); leave(); return; }   // in the cellar: step back up
  const j=e.key==="ArrowRight"?(i+1)%VISIBLE.length:(i-1+VISIBLE.length)%VISIBLE.length;
  closeCard(); enter(document.querySelector(`.room[data-id="${VISIBLE[j].id}"]`));
});
</script>
</body>
</html>
